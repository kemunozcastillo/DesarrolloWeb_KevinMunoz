<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Inventario</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            let productos = [
                {"id": "1", "nombre": "Martillo", "precio": "$5.000", "stock": "12"},
                {"id": "2", "nombre": "Tijera", "precio": "$3.000", "stock": "7"}
            ];

            function agregarProducto() {
                let id = document.getElementById("txtId").value;
                let nombre = document.getElementById("txtNombre").value;
                let precio = document.getElementById("txtPrecio").value;
                let stock = document.getElementById("txtStock").value;

                if (id == "" || nombre == "" || precio == "" || stock == "") {
                    alert("Completa todos los campos.");
                    return;
                }

                productos.push({"id": id, "nombre": nombre, "precio": precio, "stock": stock});

                document.getElementById("txtId").value = "";
                document.getElementById("txtNombre").value = "";
                document.getElementById("txtPrecio").value = "";
                document.getElementById("txtStock").value = "";

                mostrarProductos();
            }

            function vaciarLista() {
                productos = [];
                mostrarProductos();
            }

            function mostrarProductos() {
                let lista = document.getElementById("listaProductos");
                lista.innerHTML = "";

                let tabla = document.createElement("table");
                tabla.className = "table table-bordered";

                let filaTitulos = document.createElement("tr");
                let titulos = ["ID", "Nombre", "Precio", "Stock"];

                for (let i = 0; i < titulos.length; i++) {
                    let celdaTitulo = document.createElement("th");
                    celdaTitulo.textContent = titulos[i];
                    filaTitulos.appendChild(celdaTitulo);
                }

                tabla.appendChild(filaTitulos);

                for (let i = 0; i < productos.length; i++) {
                    let fila = document.createElement("tr");

                    let celdaId = document.createElement("td");
                    celdaId.textContent = productos[i].id;

                    let celdaNombre = document.createElement("td");
                    celdaNombre.textContent = productos[i].nombre;

                    let celdaPrecio = document.createElement("td");
                    celdaPrecio.textContent = productos[i].precio;

                    let celdaStock = document.createElement("td");
                    celdaStock.textContent = productos[i].stock;

                    fila.appendChild(celdaId);
                    fila.appendChild(celdaNombre);
                    fila.appendChild(celdaPrecio);
                    fila.appendChild(celdaStock);

                    tabla.appendChild(fila);
                }

                lista.appendChild(tabla);
                document.getElementById("total").textContent = "Total de productos: " + productos.length;
            }
        </script>
    </head>
    <body onload="mostrarProductos();">
        <div class="container mt-3">
            <h2>Inventario</h2>
            <hr>
            <label class="form-label">ID:</label>
            <input type="text" class="form-control mb-2" id="txtId">
            <label class="form-label">Nombre:</label>
            <input type="text" class="form-control mb-2" id="txtNombre">
            <label class="form-label">Precio:</label>
            <input type="text" class="form-control mb-2" id="txtPrecio">
            <label class="form-label">Stock:</label>
            <input type="text" class="form-control mb-2" id="txtStock">
            <button type="button" class="btn btn-primary mb-3" onclick="agregarProducto();">Agregar</button>
            <button type="button" class="btn btn-secondary mb-3" onclick="vaciarLista();">Vaciar lista</button>
            <hr>
            <div id="listaProductos"></div>
            <p id="total"></p>
        </div>
    </body>
</html>
